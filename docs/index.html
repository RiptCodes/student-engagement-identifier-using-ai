<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Engagement Analysis Using Facial Recognition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <h1>Student Engagement Analysis Using Facial Recognition</h1>

  <div class="stage">
    <div class="canvas-holder">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="start-cover">
        <button id="btn-start">Start Camera</button>
      </div>
    </div>

    <div class="score-row">
      <div id="score-label">—</div>
      <div id="score-pct"></div>
    </div>

    <div class="controls" id="controls" hidden>
      <button id="btn-stop">Stop</button>
      <button id="btn-pause">Pause</button>
      <button id="btn-snap">Save snapshot</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
